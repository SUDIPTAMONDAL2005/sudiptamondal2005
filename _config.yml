title: Sudipta Mondal
description: B.Sc. IT (Cloud Technology & Information Security) student, Python and web developer
theme: jekyll-theme-cayman
url: "https://sudiptamondal2005.github.io"
baseurl: ""

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
